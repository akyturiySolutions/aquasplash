<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b2a63">
  <meta name="description" content="Quality, safe, affordable drinking water delivered across Mombasa, Kwale, and Kilifi Counties — order online.">

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AquaSplash">
  <link rel="apple-touch-icon" href="images/icon-192.png">

  <!-- Open Graph — WhatsApp/Facebook link previews -->
  <meta property="og:title" content="AquaSplash">
  <meta property="og:description" content="Quality, safe, affordable drinking water delivered across Mombasa, Kwale, and Kilifi Counties — order online.">
  <meta property="og:image" content="images/icon-512.png">
  <meta property="og:type" content="website">

  <title>AquaSplash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <div id="header"></div>
  <div id="updateBanner" class="update-banner" style="display:none">
    <span>A new version is available</span>
    <button onclick="window._forceRefresh()">Refresh</button>
  </div>
  <div id="content"></div>
  <div id="nav"></div>
</div>

<!-- Service Worker registration + update detection -->
<script>
  function showUpdateBanner() {
    const banner = document.getElementById('updateBanner');
    if (banner) banner.style.display = 'flex';
  }

  // ── Primary update check: poll a tiny version marker over the
  // network ────────────────────────────────────────────────────
  // We used to rely only on the service worker's own updatefound/
  // statechange events to know a new version had shipped. That
  // depends on the browser actually running its background SW
  // update check on its own schedule, which installed home-screen
  // apps (especially on iOS, but Android isn't perfectly reliable
  // either once the app has been backgrounded/reopened many times)
  // do not do consistently — hence the banner working once and
  // then going quiet. This check doesn't depend on the SW lifecycle
  // at all: version.json is served with no-cache headers AND the
  // service worker (see sw.js) is told to never answer it from its
  // own cache, so every fetch here is a genuine round trip to the
  // server, and a version.json that doesn't match what we saw last
  // means a new deploy is live.
  let knownVersion = null;
  try { knownVersion = localStorage.getItem('appVersion'); } catch (e) {}

  function checkVersion() {
    fetch('/version.json', { cache: 'no-store' })
      .then(res => (res && res.ok) ? res.json() : null)
      .then(data => {
        if (!data || !data.version) return;
        if (knownVersion === null) {
          // First time this device has ever checked — just record
          // the baseline, nothing to announce yet.
          knownVersion = data.version;
          try { localStorage.setItem('appVersion', knownVersion); } catch (e) {}
          return;
        }
        if (data.version !== knownVersion) {
          knownVersion = data.version;
          try { localStorage.setItem('appVersion', knownVersion); } catch (e) {}
          showUpdateBanner();
        }
      })
      .catch(() => {});
  }

  checkVersion();
  setInterval(checkVersion, 60 * 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkVersion();
  });

  // ── Refresh action: don't just reload — that would still be
  // served cache-first by whatever service worker is currently
  // controlling the page if its own update never got a chance to
  // install. So we tear the old registration down completely and
  // reload with a cache-busting URL, which guarantees the next
  // load is genuinely fresh regardless of what state the old SW
  // was stuck in, then a brand-new SW re-installs from scratch.
  window._forceRefresh = async function () {
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
    } catch (e) {}
    window.location.href = window.location.pathname + '?_v=' + Date.now();
  };

  // ── Secondary signal: the service worker's own update events ──
  // Kept as a fast-path for the (common) case where the browser's
  // native update check does work — it can surface the banner
  // sooner than the next 60s version poll. Harmless if it never
  // fires; checkVersion() above is what we actually depend on.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        reg.update();
        setInterval(() => reg.update(), 60 * 1000);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });

        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner();
            }
          });
        });
      }).catch(err => console.log('SW registration failed:', err));
    });
  }
</script>

<!-- App bootstrap -->
<script type="module" src="js/app.js"></script>
</body>
</html>
