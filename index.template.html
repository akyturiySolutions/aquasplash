<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="{{THEME_COLOR}}">
  <meta name="description" content="{{META_DESCRIPTION}}">

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{SHORT_NAME}}">
  <link rel="apple-touch-icon" href="images/icon-192.png">

  <!-- Open Graph — WhatsApp/Facebook link previews -->
  <meta property="og:title" content="{{BUSINESS_NAME}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:type" content="website">

  <title>{{BUSINESS_NAME}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <div id="header"></div>
  <div id="updateBanner" class="update-banner" style="display:none">
    <span>A new version is available</span>
    <button onclick="window.location.reload()">Refresh</button>
  </div>
  <div id="content"></div>
  <div id="nav"></div>
</div>

<!-- Service Worker registration + update detection -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        // Check for a newer sw.js right away, and periodically while
        // the app stays open (catches long-lived sessions that never
        // fully close, which is common once installed on a phone).
        reg.update();
        setInterval(() => reg.update(), 60 * 1000);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });

        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            // 'installed' + an existing controller means this is an
            // update to an already-running app, not the first install.
            // We deliberately do NOT auto-reload here — someone could
            // be mid-order — we just let them know one is ready.
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              window.dispatchEvent(new CustomEvent('sw-update-available'));
            }
          });
        });
      }).catch(err => console.log('SW registration failed:', err));
    });
  }
</script>

<!-- App bootstrap -->
<script type="module" src="js/app.js"></script>
</body>
</html>
